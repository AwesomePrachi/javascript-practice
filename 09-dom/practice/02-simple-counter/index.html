<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Counter</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <main class="counter-container">
        <h1>Simple Counter</h1>

        <p id="count" aria-live="polite">0</p>

        <div class="button-group">
            <button id="increase" type="button">＋ Increase</button>
            <button id="decrease" type="button">− Decrease</button>
        </div>

        <button id="reset" type="button">Reset counter</button>

        <p class="description">
            Use the buttons to increase, decrease, or reset the counter.
        </p>
    </main>
</body>
</html>
