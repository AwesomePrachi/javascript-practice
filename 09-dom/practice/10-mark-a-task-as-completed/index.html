<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A JavaScript DOM practice project for marking tasks as completed and tracking progress."
    >

    <title>Task Tracker | JavaScript Practice</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="container">
        <p class="eyebrow">JAVASCRIPT MINI PROJECT</p>

        <h1>Daily Tasks<span>.</span></h1>

        <p class="description">
            Progress comes from small steps.
            Check off each task as you complete it.
        </p>

        <section class="progress-section" aria-label="Task completion progress">
            <div class="progress-info">
                <span class="progress-label">YOUR PROGRESS</span>

                <span
                    id="progressText"
                    aria-live="polite"
                    aria-atomic="true"
                >0 of 3 completed</span>
            </div>

            <div
                class="progress-track"
                id="progressTrack"
                role="progressbar"
                aria-label="Tasks completed"
                aria-valuemin="0"
                aria-valuemax="3"
                aria-valuenow="0"
            >
                <div id="progressBar"></div>
            </div>
        </section>

        <ul id="taskList" aria-label="Daily tasks">
            <li class="task-item">
                <input
                    type="checkbox"
                    class="task-checkbox"
                    id="task1"
                >
                <label for="task1" class="task-text">
                    Learn HTML
                </label>
            </li>

            <li class="task-item">
                <input
                    type="checkbox"
                    class="task-checkbox"
                    id="task2"
                >
                <label for="task2" class="task-text">
                    Practice CSS
                </label>
            </li>

            <li class="task-item">
                <input
                    type="checkbox"
                    class="task-checkbox"
                    id="task3"
                >
                <label for="task3" class="task-text">
                    Build a JavaScript project
                </label>
            </li>
        </ul>

        <footer class="footer">
            BUILT WITH <span>HTML</span> · <span>CSS</span> ·
            <span>JAVASCRIPT</span>
            <br>
            Small steps. Consistent progress.
        </footer>
    </main>
</body>
</html>
