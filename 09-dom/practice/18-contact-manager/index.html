<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d14">
  <title>Contact Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="app-container">

    <header class="app-header">
      <div>
        <p class="eyebrow">PERSONAL ORGANIZER</p>
        <h1>Contact Manager</h1>
        <p class="subtitle">Keep your important connections in one place.</p>
      </div>

      <div class="header-icon" aria-hidden="true">✦</div>
    </header>

    <section class="stats-card">
      <div class="stats-icon" aria-hidden="true">♧</div>

      <div class="stats-info">
        <p class="stats-label">TOTAL CONTACTS</p>
        <h2 id="totalContacts">0</h2>
      </div>

      <span class="stats-badge">Your contacts</span>
    </section>

    <section class="form-section">
      <div class="section-heading">
        <div>
          <p class="section-label">GET STARTED</p>
          <h2>Add a new contact</h2>
        </div>
        <span class="plus-icon" aria-hidden="true">+</span>
      </div>

      <form id="contactForm">
        <div class="input-group">
          <label for="contactName">Full name</label>
          <input
            type="text"
            id="contactName"
            placeholder="Enter contact name"
            autocomplete="name"
            required
          >
        </div>

        <div class="input-group">
          <label for="contactPhone">Phone number</label>
          <input
            type="tel"
            id="contactPhone"
            placeholder="Enter phone number"
            autocomplete="tel"
            required
          >
        </div>

        <button type="submit" class="add-button">
          <span aria-hidden="true">+</span>
          Add Contact
        </button>
      </form>
    </section>

    <section class="contacts-section">
      <div class="contacts-heading">
        <div>
          <p class="section-label">YOUR DIRECTORY</p>
          <h2>All Contacts</h2>
        </div>

        <span class="contact-count" id="contactCount">0 contacts</span>
      </div>

      <div class="search-box">
        <span aria-hidden="true">⌕</span>
        <input
          type="search"
          id="searchInput"
          placeholder="Search contacts..."
          aria-label="Search contacts"
        >
      </div>

      <div class="contact-list" id="contactList" aria-live="polite">
        <!-- Contacts and empty states will be rendered here -->
      </div>
    </section>

    <footer class="app-footer">
      <p>Made for keeping connections close.</p>
    </footer>

  </main>

</body>
</html>
