<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A simple contact manager built with HTML, CSS and JavaScript."
    >

    <title>Contactly | Contact Manager</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="app">

        <!-- Header -->
        <header class="header">
            <div class="logo" aria-hidden="true">♧</div>

            <div>
                <p class="eyebrow">Personal Organizer</p>
                <h1>Contact Manager</h1>
                <p class="subtitle">
                    Keep your important connections in one place.
                </p>
            </div>
        </header>

        <!-- Contact Statistics -->
        <section class="stats-card" aria-label="Contact statistics">
            <div>
                <p class="stats-label">Total Contacts</p>
                <p class="stats-number" id="totalContacts" aria-live="polite">
                    3
                </p>
            </div>

            <div class="stats-icon" aria-hidden="true">♧</div>
        </section>

        <!-- Add Contact Form -->
        <section class="panel" aria-labelledby="formTitle">
            <h2 class="section-title" id="formTitle">
                Add New Contact
            </h2>

            <p class="section-description">
                Save someone's details to your contact list.
            </p>

            <form id="contactForm" novalidate>
                <div class="form-grid">

                    <div class="field">
                        <label for="contactName">Full Name</label>

                        <div class="input-wrapper">
                            <span class="input-icon" aria-hidden="true">♙</span>

                            <input
                                type="text"
                                id="contactName"
                                placeholder="e.g. Priya Sharma"
                                maxlength="60"
                                autocomplete="off"
                                aria-describedby="formMessage"
                                required
                            >
                        </div>
                    </div>

                    <div class="field">
                        <label for="contactPhone">Phone Number</label>

                        <div class="input-wrapper">
                            <span class="input-icon" aria-hidden="true">⌕</span>

                            <input
                                type="tel"
                                id="contactPhone"
                                placeholder="e.g. 9876543210"
                                maxlength="20"
                                autocomplete="tel"
                                inputmode="tel"
                                aria-describedby="formMessage"
                                required
                            >
                        </div>
                    </div>

                </div>

                <p
                    class="form-message"
                    id="formMessage"
                    role="status"
                    aria-live="polite"
                    aria-atomic="true"
                ></p>

                <button type="submit" class="add-button">
                    <span aria-hidden="true">＋</span>
                    Add Contact
                </button>
            </form>
        </section>

        <!-- Contact List -->
        <section
            class="panel contacts-panel"
            aria-labelledby="contactsTitle"
        >
            <div class="contacts-heading">
                <h2 class="contacts-title" id="contactsTitle">
                    Your Contacts
                </h2>

                <span class="count-badge" id="contactCount">
                    3 contacts
                </span>
            </div>

            <!-- Search -->
            <div class="search-wrapper">
                <label for="searchInput" class="visually-hidden">
                    Search contacts by name
                </label>

                <span class="search-icon" aria-hidden="true">⌕</span>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search contacts by name..."
                    autocomplete="off"
                >
            </div>

            <!-- Contact Cards -->
            <div
                class="contact-list"
                id="contactList"
                aria-live="polite"
                aria-atomic="false"
            ></div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            BUILT WITH HTML · CSS · JAVASCRIPT
        </footer>

    </main>
</body>
</html>
