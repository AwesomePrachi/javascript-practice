<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A simple contact manager interface built with HTML, CSS and JavaScript."
    >

    <title>Contact Manager</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="app">

        <!-- Header -->
        <header class="header">
            <div class="logo" aria-hidden="true">♧</div>

            <div>
                <p class="eyebrow">Personal Organizer</p>
                <h1>Contact Manager</h1>
                <p class="subtitle">
                    Keep your important connections in one place.
                </p>
            </div>
        </header>

        <!-- Contact Statistics -->
        <section class="stats-card" aria-label="Contact statistics">
            <div>
                <p class="stats-label">Total Contacts</p>
                <p
                    class="stats-number"
                    id="totalContacts"
                    aria-live="polite"
                >
                    0
                </p>
            </div>

            <div class="stats-icon" aria-hidden="true">♧</div>
        </section>

        <!-- Add Contact Form -->
        <section class="panel" aria-labelledby="formTitle">
            <h2 class="section-title" id="formTitle">
                Add New Contact
            </h2>

            <p class="section-description">
                Save someone's details to your contact list.
            </p>

            <form>
                <div class="form-grid">

                    <div class="field">
                        <label for="contactName">Full Name</label>

                        <div class="input-wrapper">
                            <span aria-hidden="true">♙</span>

                            <input
                                type="text"
                                id="contactName"
                                placeholder="e.g. Priya Sharma"
                            >
                        </div>
                    </div>

                    <div class="field">
                        <label for="contactPhone">Phone Number</label>

                        <div class="input-wrapper">
                            <span aria-hidden="true">⌕</span>

                            <input
                                type="tel"
                                id="contactPhone"
                                placeholder="e.g. 9876543210"
                            >
                        </div>
                    </div>

                </div>

                <button type="button" class="add-button">
                    <span aria-hidden="true">＋</span>
                    Add Contact
                </button>
            </form>
        </section>

        <!-- Contact List -->
        <section class="panel contacts-panel">
            <div class="contacts-heading">
                <h2 class="contacts-title">Your Contacts</h2>

                <span class="count-badge" id="contactCount">
                    0 contacts
                </span>
            </div>

            <!-- Search -->
            <div class="search-wrapper">
                <span aria-hidden="true">⌕</span>

                <input
                    type="search"
                    placeholder="Search contacts by name..."
                    aria-label="Search contacts by name"
                >
            </div>

            <!-- Contacts will be rendered using JavaScript -->
            <div
                class="contact-list"
                id="contactList"
                aria-live="polite"
                aria-atomic="false"
            ></div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            BUILT WITH HTML · CSS · JAVASCRIPT
        </footer>

    </main>
</body>
</html>
