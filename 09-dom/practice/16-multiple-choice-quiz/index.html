<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="An interactive multiple-choice quiz built with HTML, CSS, and JavaScript."
    >

    <title>CodeQuiz | JavaScript Challenge</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="quiz-card">

        <!-- Quiz Screen -->
        <section id="quizScreen" aria-labelledby="quizTitle">

            <header class="quiz-header">
                <div class="logo" aria-hidden="true">&lt;/&gt;</div>

                <div>
                    <p class="eyebrow">Interactive Challenge</p>
                    <h1 id="quizTitle">CodeQuiz</h1>
                    <p class="header-description">
                        Test your JavaScript knowledge.
                    </p>
                </div>
            </header>

            <!-- Progress -->
            <div class="progress-section">
                <div class="progress-info">
                    <span id="questionCounter">Question 1 of 5</span>
                    <strong id="progressPercent">0%</strong>
                </div>

                <div
                    class="progress-track"
                    role="progressbar"
                    id="progressTrack"
                    aria-label="Quiz completion progress"
                    aria-valuemin="0"
                    aria-valuemax="5"
                    aria-valuenow="0"
                    aria-valuetext="0 of 5 questions answered"
                >
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>

            <!-- Question -->
            <p class="question-label">Your Question</p>

            <h2
                class="question-text"
                id="questionText"
                tabindex="-1"
            >
                What does HTML stand for?
            </h2>

            <!-- Answer Options -->
            <div
                class="answers"
                id="answersContainer"
                aria-label="Answer options"
            >
                <!-- Answer buttons are created using JavaScript. -->
            </div>

            <!-- Answer Feedback -->
            <div
                class="feedback"
                id="feedback"
                aria-live="polite"
                aria-atomic="true"
            ></div>

            <!-- Quiz Footer -->
            <div class="quiz-footer">
                <p class="score-label">
                    Current score:
                    <strong id="currentScore">0</strong>
                </p>

                <button
                    class="primary-button"
                    id="nextButton"
                    type="button"
                    disabled
                >
                    Next Question →
                </button>
            </div>

        </section>

        <!-- Final Results Screen -->
        <section
            class="results hidden"
            id="resultsScreen"
            aria-labelledby="resultTitle"
        >

            <div class="result-icon" id="resultIcon" aria-hidden="true">
                🏆
            </div>

            <p class="result-eyebrow">QUIZ COMPLETED</p>

            <h2
                class="result-title"
                id="resultTitle"
                tabindex="-1"
            >
                Great job!
            </h2>

            <p class="result-description" id="resultDescription">
                You completed the JavaScript challenge.
            </p>

            <div class="result-score-card">
                <p class="result-percentage" id="resultPercentage">
                    0%
                </p>

                <p class="result-fraction" id="resultFraction">
                    You scored 0 out of 5.
                </p>

                <div
                    class="result-bar-track"
                    role="progressbar"
                    id="resultProgressTrack"
                    aria-label="Final quiz score"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                    aria-valuetext="0 percent"
                >
                    <div class="result-bar" id="resultBar"></div>
                </div>
            </div>

            <button
                class="primary-button"
                id="restartButton"
                type="button"
            >
                ↻ Play Again
            </button>

        </section>

        <footer>BUILT WITH HTML · CSS · JAVASCRIPT</footer>

    </main>

</body>
</html>
