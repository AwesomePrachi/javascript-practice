<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker | JavaScript Practice</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app">
        <header class="header">
            <div class="logo" aria-hidden="true">↗</div>
            <div>
                <p class="eyebrow">PERSONAL FINANCE</p>
                <h1>Expense Tracker</h1>
                <p class="subtitle">Track your spending. Stay in control.</p>
            </div>
        </header>

        <section class="summary-card" aria-label="Expense summary">
            <p class="summary-label">Total Expenses</p>
            <p class="total-amount" id="totalAmount">₹0.00</p>
            <div class="summary-bottom">
                <span>Expenses recorded</span>
                <strong id="summaryCount">0 items</strong>
            </div>
        </section>

        <section class="panel">
            <h2 class="section-title">Add a new expense</h2>
            <p class="section-description">
                Enter the expense name and amount to get started.
            </p>

            <form id="expenseForm">
                <div class="form-grid">
                    <div class="field">
                        <label for="expenseName">Expense name</label>
                        <input
                            type="text"
                            id="expenseName"
                            placeholder="e.g. Groceries"
                            maxlength="80"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="expenseAmount">Amount (₹)</label>
                        <input
                            type="number"
                            id="expenseAmount"
                            placeholder="e.g. 450"
                            min="0.01"
                            max="1000000000"
                            step="0.01"
                            required
                        >
                    </div>
                </div>

                <button class="add-button" type="submit">
                    + Add Expense
                </button>
            </form>
        </section>

        <section class="panel">
            <div class="list-header">
                <h2 class="list-title">Your Expenses</h2>
                <span class="count-badge" id="expenseCount">0 expenses</span>
            </div>

            <div class="expense-list" id="expenseList" aria-live="polite">
            </div>
        </section>

        <footer>BUILT WITH HTML · CSS · JAVASCRIPT</footer>
    </main>
</body>
</html>
