<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A simple expense tracker built with HTML, CSS, and JavaScript."
    >

    <title>Expense Tracker | JavaScript Practice</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app">
        <!-- Page Header -->
        <header class="header">
            <div class="logo" aria-hidden="true">↗</div>

            <div>
                <p class="eyebrow">PERSONAL FINANCE</p>
                <h1>Expense Tracker</h1>
                <p class="subtitle">
                    Track your spending. Stay in control.
                </p>
            </div>
        </header>

        <!-- Expense Summary -->
        <section class="summary-card" aria-label="Expense summary">
            <div class="summary-top">
                <p class="summary-label">Total Expenses</p>
                <span class="summary-badge">● Live Summary</span>
            </div>

            <p class="total-amount" id="totalAmount" aria-live="polite">
                ₹0.00
            </p>

            <div class="summary-bottom">
                <span>Expenses recorded</span>
                <strong id="summaryCount">0 items</strong>
            </div>
        </section>

        <!-- Add Expense Form -->
        <section class="panel">
            <h2 class="section-title">Add a new expense</h2>

            <p class="section-description">
                Enter the expense name and amount to get started.
            </p>

            <form id="expenseForm" novalidate>
                <div class="form-grid">
                    <div class="field">
                        <label for="expenseName">Expense name</label>

                        <div class="input-wrapper">
                            <span class="input-icon" aria-hidden="true">✎</span>

                            <input
                                type="text"
                                id="expenseName"
                                name="expenseName"
                                placeholder="e.g. Groceries"
                                maxlength="80"
                                autocomplete="off"
                                aria-describedby="nameError"
                                required
                            >
                        </div>

                        <small
                            class="field-error"
                            id="nameError"
                            aria-live="polite"
                            hidden
                        ></small>
                    </div>

                    <div class="field">
                        <label for="expenseAmount">Amount (₹)</label>

                        <div class="input-wrapper">
                            <span class="input-icon" aria-hidden="true">₹</span>

                            <input
                                type="number"
                                id="expenseAmount"
                                name="expenseAmount"
                                placeholder="e.g. 450"
                                min="0.01"
                                max="1000000000"
                                step="0.01"
                                aria-describedby="amountError"
                                required
                            >
                        </div>

                        <small
                            class="field-error"
                            id="amountError"
                            aria-live="polite"
                            hidden
                        ></small>
                    </div>
                </div>

                <button class="add-button" type="submit">
                    <span aria-hidden="true">＋</span>
                    Add Expense
                </button>

                <p
                    class="form-message"
                    id="formMessage"
                    role="status"
                    aria-live="polite"
                ></p>
            </form>
        </section>

        <!-- Expense List -->
        <section class="panel">
            <div class="list-header">
                <h2 class="list-title">Your Expenses</h2>

                <span class="count-badge" id="expenseCount">
                    0 expenses
                </span>
            </div>

            <div class="expense-list" id="expenseList" aria-live="polite">
                <!-- Expenses are rendered using JavaScript. -->
            </div>
        </section>

        <footer>BUILT WITH HTML · CSS · JAVASCRIPT</footer>
    </main>
</body>
</html>
